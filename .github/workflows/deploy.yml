# MVP deploy: publish site/ (plus the data file) to GitHub Pages on every push to main.
# One-time repo setting: Settings -> Pages -> Source: "GitHub Actions".
# After the MVP this is replaced by build-and-deploy.yml (see CLAUDE.md, Architecture).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run in progress finishes; queued runs collapse to the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Assemble site
        # -L follows the site/data -> ../data symlink, so the data file is copied in for real.
        run: |
          rm -rf _site
          cp -rL site _site
          test -f _site/index.html
          test -f _site/data/mock-data.json && test ! -L _site/data

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
