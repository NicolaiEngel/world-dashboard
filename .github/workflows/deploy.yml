# MVP deploy: test, fetch real data, then publish site/ (plus the data files) to GitHub Pages
# on every push to main, once a day (05:17 UTC), and on manual dispatch.
# One-time repo setting: Settings -> Pages -> Source: "GitHub Actions".
# After the MVP this is replaced by build-and-deploy.yml (see CLAUDE.md, Architecture).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"   # daily refresh, off-peak minute
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run in progress finishes; queued runs collapse to the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pipeline dependencies
        run: pip install -r requirements.txt

      - name: Test pipeline (recorded fixtures, no network)
        run: python -m pytest -q

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Fetch real data
        # Never fails the deploy for a source error: a failed indicator keeps the last
        # published real data (last-good), else its mock data. Summary -> job summary.
        run: >-
          python -m pipeline.run --out data/dashboard.json
          --last-good "${{ steps.pages.outputs.base_url }}/data/dashboard.json"

      - name: Assemble site
        # -L follows the site/data -> ../data symlink, so the data file is copied in for real.
        run: |
          rm -rf _site
          cp -rL site _site
          test -f _site/index.html
          test -f _site/data/mock-data.json && test -f _site/data/dashboard.json && test ! -L _site/data

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # Keeps the daily schedule from being disabled after 60 days without repository activity.
  # Opt-in per repository (Settings -> Secrets and variables -> Actions -> Variables:
  # KEEPALIVE = true), so forks don't inherit it. Uses the API with the built-in token;
  # no commits. GitHub doesn't document that re-enabling resets the timer: see DECISIONS.md.
  keepalive:
    if: vars.KEEPALIVE == 'true' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the scheduled workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
