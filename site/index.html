<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Dashboard</title>
  <meta name="description" content="The state of the world at a glance: global indicators for the planet, people, economy and conflict.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ffffff'/%3E%3Cpolyline points='4,22 11,16 17,19 28,8' fill='none' stroke='%232f6fdb' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__main">
      <h1 class="site-title">World Dashboard</h1>
    </div>
    <button id="realtime-toggle" class="realtime-toggle" type="button" aria-pressed="false" hidden>Load real-time exchange rates (connects to Frankfurter)</button>
    <div class="site-header__icons" aria-hidden="true">
      <span class="icon" title="Language (coming later)">🌐</span>
      <span class="icon" title="Edit (coming later)">✏️</span>
      <span class="icon" title="Account (coming later)">👤</span>
    </div>
  </header>

  <main id="dashboard" class="dashboard" aria-live="polite">
    <p class="dashboard__loading">Loading data…</p>
  </main>

  <template id="tile-template">
    <article class="tile">
      <div class="tile__head">
        <h3 class="tile__title"></h3>
        <span class="badge-mock" title="Illustrative mock data – not real values">MOCK<span class="visually-hidden">: illustrative mock data, not real values</span></span>
      </div>
      <p class="tile__subtitle"></p>
      <div class="tile__valuerow">
        <p class="tile__value"><span class="tile__number"></span><span class="tile__unit"></span></p>
        <button class="tile__expand" type="button" aria-label="Enlarge chart">⤢</button>
      </div>
      <div class="tile__chart"><canvas aria-hidden="true"></canvas></div>
      <footer class="tile__footer">
        <p class="tile__when"><span class="tile__cadence"></span> · <time class="tile__date"></time></p>
        <p class="tile__source">Source: <a class="tile__source-link" target="_blank" rel="noopener noreferrer"></a></p>
      </footer>
    </article>
  </template>

  <dialog id="expand" class="expand" aria-labelledby="expand-title">
    <div class="expand__panel">
      <div class="expand__head">
        <h2 id="expand-title" class="expand__title"></h2>
        <span class="badge-mock" title="Illustrative mock data – not real values">MOCK<span class="visually-hidden">: illustrative mock data, not real values</span></span>
        <span class="expand__unit"></span>
        <button class="expand__close" type="button" aria-label="Close">✕</button>
      </div>
      <div class="expand__chart"><canvas aria-hidden="true"></canvas></div>
      <p class="expand__source">Source: <a class="expand__source-link" target="_blank" rel="noopener noreferrer"></a></p>
    </div>
  </dialog>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="app.js"></script>
  <script src="realtime.js"></script>
  <script src="expand.js"></script>
</body>
</html>
